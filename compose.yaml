name: tongpin-standalone
services:
  tongpin:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-18886}:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18886}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TRUSTED_PROXY_CIDRS: ""
      TRUSTED_PROXY_HOSTS: ""
    volumes:
      - tongpin-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
volumes:
  tongpin-data:
