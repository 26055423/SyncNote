<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 同频</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css?v=20261009-login25"><script src="/login-security.js?v=20261010-registration2" defer></script><script src="/registration.js?v=20261010-registration2" defer></script><script src="/auth.js?v=20261010-registration2" defer></script><style>#auth-form [hidden]{display:none!important}#auth-error:empty{display:none!important}.auth-panel .password-visibility-wrap{border:0;background:transparent;box-shadow:none;padding:0}</style><link rel="stylesheet" href="/login-security.css?v=20261010-registration2"></head><body class="auth-body"><main class="auth-main"><a class="brand" href="/">▥ <strong>同频</strong><span>交易看板</span></a><section class="panel auth-panel"><p class="eyebrow">TRADING TOGETHER</p><h1 id="auth-title">登录你的交易圈</h1><p class="auth-intro" id="auth-intro">连接自己的账户，关注一起交易的人。</p><form id="auth-form"><label>用户名<input id="username" name="username" autocomplete="username" minlength="2" maxlength="24" pattern="[a-zA-Z0-9_]{2,24}" placeholder="2～24 位字母、数字或下划线" required></label><label id="nickname-field" hidden>昵称<input id="nickname" name="nickname" maxlength="30" placeholder="朋友看到的名字"></label><label>密码<input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><label id="confirm-field" hidden>确认密码<input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></label><label id="invite-field" hidden>邀请码<input id="invite-code" name="invite_code" maxlength="32" autocomplete="off" placeholder="请输入管理员提供的邀请码"></label><div id="captcha-tools" hidden style="margin-top:16px"><p id="captcha-instruction">点击与其他图案不同的一项</p><div class="pattern-wrap" style="position:relative;width:210px;height:150px"><img id="captcha-image" alt="图案验证" style="width:210px;height:150px"><div id="pattern-buttons" style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)"></div></div><button id="captcha-refresh" type="button" style="width:auto;margin-top:8px;padding:5px 10px;background:transparent;color:inherit">刷新图案</button></div><p class="form-feedback" id="auth-error" role="alert"></p><button class="primary-button" id="auth-submit" type="submit">登录</button></form><p class="auth-switch" id="auth-switch"></p></section></main></body></html>
