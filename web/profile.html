<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心 · 同频</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/api.js" defer></script><script src="/assistant.js" defer></script><script src="/avatars.js" defer></script><script src="/profile.js" defer></script></head><body><header><a class="brand" href="/">▥ <strong>同频</strong><span>个人中心</span></a><div class="header-actions"><a class="back-link" href="/">返回交易看板</a><button id="logout">退出登录</button></div></header><main class="profile-page"><div class="page-heading"><div><p class="eyebrow">YOUR TRADING CIRCLE</p><h1 id="profile-title">个人中心</h1></div><span id="profile-username"></span></div><p id="page-feedback" class="form-feedback" role="status"></p><div class="profile-grid">
<div class="profile-column"><article id="invite-panel" class="panel profile-panel" hidden><h2>注册邀请码</h2><p class="profile-hint">仅你可见。每个邀请码只能成功注册一次，使用后自动更换；也可以手动更换，让旧码立即失效。</p><label>当前邀请码<input id="current-invite" readonly autocomplete="off"></label><div class="connect-actions"><button id="copy-invite" type="button">复制邀请码</button><button id="rotate-invite" type="button">更换邀请码</button></div><p id="invite-feedback" class="form-feedback" role="status"></p></article><article class="panel profile-panel"><h2>个人资料</h2><form id="details-form"><label>昵称<input id="nickname" maxlength="30" required></label><label>头像<input id="avatar" type="hidden"><div id="profile-avatar-picker" class="avatar-picker"></div></label><label>个人简介<textarea id="bio" maxlength="300" rows="3" placeholder="介绍你的交易偏好…"></textarea></label><button class="primary-button">保存资料</button><p class="form-feedback" role="status"></p></form></article>
<article class="panel profile-panel"><h2>隐私设置</h2><form id="settings-form"><label class="switch-row"><span><b>允许被关注</b><small>关闭后阻止新关注，已有关注关系保留。</small></span><input id="allow-follow" type="checkbox"></label><label class="switch-row"><span><b>向关注者展示交易数据</b><small>关闭后，关注者看不到你的账户、持仓和记录，也收不到交易提醒。</small></span><input id="share-data" type="checkbox"></label><label class="switch-row"><span><b>向关注者分享复盘</b><small>同时开启交易数据后，关注者可查看你的复盘笔记和图表，不能修改。关闭后立即停止分享。</small></span><input id="share-reviews" type="checkbox"></label><p class="profile-hint">交流板由互相关注关系决定，与交易数据开关独立。</p><button class="primary-button">保存设置</button><p class="form-feedback" role="status"></p></form></article>
<article class="panel profile-panel"><h2>修改密码</h2><form id="password-form"><label>当前密码<input id="current-password" type="password" autocomplete="current-password" required></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="primary-button">更新密码</button><p class="form-feedback" role="status"></p></form></article></div>
<div class="profile-column">
<article class="panel profile-panel"><h2>查找交易伙伴</h2><form id="search-form"><div class="search-row"><label class="sr-only" for="search">用户名或昵称</label><input id="search" minlength="2" maxlength="40" placeholder="输入用户名或昵称" required><button>查找</button></div><p class="form-feedback" role="status"></p></form><div id="search-results"></div></article>
<article class="panel profile-panel"><div class="section-heading"><h2>我关注的人</h2><span id="following-count"></span></div><div id="following"></div></article><article class="panel profile-panel"><div class="section-heading"><h2>关注我的人</h2><span id="followers-count"></span></div><div id="followers"></div></article><article class="panel profile-panel"><div id="assistant-panel"></div><button id="unlink" type="button">解除连接</button></article></div></div></main></body></html>
