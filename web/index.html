<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同频 · 交易看板</title><meta name="description" content="双人黄金交易持仓、交易动态与留言看板"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/avatars.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/">▥ <strong>同频</strong><span>交易看板</span></a><div class="header-actions"><button id="sound" aria-pressed="false">开启交易池记录提醒</button><label class="volume-control" for="volume">音量 <input id="volume" type="range" min="0" max="100" step="5" value="80"><output id="volume-value" for="volume">80%</output></label><a class="self-profile header-profile" id="self-profile" href="/profile"><div class="avatar" id="self-avatar">我</div><div><strong id="self-name">个人中心</strong><span id="self-username">资料 · MT5 · 关注设置</span></div><span class="profile-entry">个人中心</span></a><button hidden id="demo" aria-pressed="false">查看演示</button></div></header>
<main>
<div class="notice" id="notice"><span class="ticker-label">交易动态</span><div class="ticker-window"><span class="ticker-placeholder">正在读取最新动态…</span></div></div>
<div id="alert" role="status" aria-live="polite" hidden></div>
<div class="workspace"><section class="accounts" id="accounts" aria-label="成员账户与交易记录" aria-busy="true"><article class="account account-loading" aria-label="正在读取账户资料"><div class="account-head"><div class="person"><div class="avatar loading-block" aria-hidden="true"></div><div><h2>账户资料</h2><small>正在读取…</small></div></div><span class="status">加载中</span></div><div class="metrics"><div class="metric"><span>账户净值</span><strong class="loading-block">—</strong><small>等待同步</small></div><div class="metric"><span>账户余额</span><strong class="loading-block">—</strong><small>等待同步</small></div><div class="metric"><span>持仓浮动盈亏</span><strong class="loading-block">—</strong><small>等待同步</small></div></div><div class="history-link-row"><span>正在确认账户信息…</span></div></article><article class="account account-loading" aria-label="正在读取账户资料"><div class="account-head"><div class="person"><div class="avatar loading-block" aria-hidden="true"></div><div><h2>账户资料</h2><small>正在读取…</small></div></div><span class="status">加载中</span></div><div class="metrics"><div class="metric"><span>账户净值</span><strong class="loading-block">—</strong><small>等待同步</small></div><div class="metric"><span>账户余额</span><strong class="loading-block">—</strong><small>等待同步</small></div><div class="metric"><span>持仓浮动盈亏</span><strong class="loading-block">—</strong><small>等待同步</small></div></div><div class="history-link-row"><span>正在确认账户信息…</span></div></article></section>
<section class="lower"><article class="panel pool"><div class="panel-title"><h2>当前交易池</h2><span id="pool-count">正在同步</span></div><div id="pool"><div class="empty pool-empty">正在读取当前持仓…</div></div></article>
<aside class="right-column"><article class="panel chat"><div class="panel-title"><h2>交流板</h2><span>一起复盘</span></div><div id="messages" aria-live="polite"></div><form id="message-form"><label class="sr-only" for="message">留言内容</label><textarea id="message" rows="2" maxlength="1000" placeholder="聊聊这笔交易，或留下一点想法…" required></textarea><div class="send-row"><span id="sender-label">正在确认账户</span><button type="submit" disabled>发送留言</button></div><p id="form-error" role="alert"></p></form></article></aside></section></div>
<footer><span>同频 / 双人交易工作台</span><span>持仓随同步更新 · 离线数据会明确标记</span></footer>
</main></body></html>
