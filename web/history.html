<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易记录 · 同频</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/api.js" defer></script><script src="/review.js" defer></script><script src="/history.js" defer></script></head><body>
<header><a class="brand" href="/">▥ <strong>同频</strong><span>交易记录</span></a><a class="back-link" href="/" id="back">返回交易看板</a></header>
<main class="history-page"><section class="page-heading"><div><p class="eyebrow">TRADE JOURNAL</p><h1 id="history-title">交易记录</h1></div></section><div id="history-notice" class="notice">正在读取交易记录…</div>
<section class="summary-grid"><article class="panel summary"><div class="panel-title"><h2 id="month-title">月度统计</h2></div><div id="month-summary" class="summary-values"></div></article><article class="panel summary"><div class="panel-title"><h2 id="year-title">年度统计</h2></div><div id="year-summary" class="summary-values"></div></article></section>
<section id="mistake-panel" class="panel mistake-panel" hidden><div class="panel-title"><h2>复盘分类</h2><span>全部已同步交易 · 点击分类查看关联订单</span></div><div id="mistake-groups" class="mistake-groups"></div><p id="mistake-empty" class="levels">点击自己的交易，写下原因并选择分类。同类问题会归到一起，帮助发现反复出现的错误。</p></section><section class="journal-workspace"><article class="panel journal-panel"><div class="panel-title"><h2 id="list-title">本月交易明细</h2><button id="clear-day" hidden>查看整月</button></div><div id="trade-list" class="table-wrap"></div></article><article class="panel calendar-panel"><div class="panel-title"><h2>交易日历</h2><div class="calendar-controls"><button id="prev-month" aria-label="上个月">上个月</button><label class="sr-only" for="month-picker">统计月份</label><input id="month-picker" type="month"><button id="next-month" aria-label="下个月">下个月</button><button id="this-month">本月</button></div></div><div class="calendar-week"> <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div id="calendar" class="calendar-grid"></div><div id="selected-day-summary" class="selected-day-summary"></div><div class="levels">按平仓日期统计 · 北京时间（UTC+8） · 盈利与亏损分别累计，净盈亏为两者之和。仅统计已同步记录。</div></article>
</section>
</main><dialog id="review-dialog" class="review-dialog"><div class="review-heading"><div><p class="eyebrow">TRADE REVIEW</p><h2 id="review-title">交易复盘</h2><p id="review-trade-summary"></p></div><button id="review-close" aria-label="关闭复盘">关闭</button></div><div class="review-workspace"><section class="review-market"><div class="review-chart-heading"><p id="chart-status"></p><button id="chart-retry" hidden>重新同步图表</button></div><div id="review-charts" class="review-charts"></div></section><aside class="review-notebook"><h3>这笔交易的笔记</h3><p class="levels" id="review-privacy-hint">只有自己能查看与修改笔记，可选多个分类。</p><div id="review-tags" class="review-tags"></div><div class="custom-tag-row"><label class="sr-only" for="custom-tag">自定义分类</label><input id="custom-tag" maxlength="40" placeholder="添加自己的问题分类"><button id="add-tag">添加</button></div><label for="note-body">入场理由、管理问题与下次改进</label><textarea id="note-body" maxlength="10000" placeholder="例如：方向判断正确，但止损没有按计划执行。下次进场前先确定止损和最大风险。"></textarea><button id="save-note" class="primary">保存笔记</button><p id="note-status" role="status" aria-live="polite"></p></aside></div></dialog></body></html>
